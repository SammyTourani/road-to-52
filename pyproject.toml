[project]
name = "r52"
version = "0.0.1"
description = "road-to-52: an open, Apple-Silicon-native LLM build stack with a public capability-per-dollar ladder measured against the frontier"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "mlx>=0.32",
  "mlx-lm>=0.31.3",
  "numpy>=2",
  "pyyaml>=6",
  "rich>=13",
  "tiktoken>=0.9",
  "safetensors>=0.5",
  "huggingface_hub>=0.30",
  "datasets>=3",
  "lm_eval>=0.4.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Explicit rule set so `ruff check` is reproducible regardless of a user-level ruff config.
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]  # single-expression lambdas are the clearest way to write schedule fixtures

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["r52"]
