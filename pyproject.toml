[project]
name = "r52"
version = "0.0.1"
description = "road-to-52: an open, Apple-Silicon-native LLM build stack with a public capability-per-dollar ladder measured against the frontier"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "mlx>=0.32",
  # mlx-lm[evaluate]: the `evaluate` extra is the lm-eval bridge (r52/eval/lmeval.py), which
  #   wraps `mlx_lm.evaluate`'s registered `mlxlm` LM class -- the install path
  #   research/05-apple-silicon-training.md §7.1 documents. The extra itself only adds
  #   `lm-eval` + `tqdm`, both already here; it is spelled out so the dependency of the
  #   bridge on that module is explicit rather than accidental.
  "mlx-lm[evaluate]>=0.31.3",
  "numpy>=2",
  "pyyaml>=6",
  "rich>=13",
  "tiktoken>=0.9",
  "safetensors>=0.5",
  "huggingface_hub>=0.30",
  "datasets>=3",
  # lm_eval task extras the `standard` suite needs (r52/eval/lmeval.py):
  #   ifeval -> langdetect, immutabledict, nltk  (IFEval's programmatic constraint checker)
  #   math   -> math_verify, antlr4-python3-runtime==4.11, sympy  (MATH-500 / hendrycks_math
  #             answer normalisation)
  # Without them those two tasks raise ImportError at task-build time; the bridge turns that
  # into a named skip rather than a crash, but the suite is then incomplete. Declared as
  # extras, not as the leaf packages, so a future lm-eval can move them.
  "lm_eval[ifeval,math]>=0.4.13",
  # -- data-ablation lab (r52/ablate, r52/tokenizer_train.py) -------------------------
  # tokenizers: trains our own byte-level BPE and writes the `tokenizer.json` mlx-lm
  #   loads (Apache-2.0; docs/PLAN.md §5's tokenizer choice). Already a transitive
  #   dependency of mlx-lm/transformers -- pinned here because we use it directly.
  "tokenizers>=0.20",
  # zstandard: `mlfoundations/dclm-baseline-1.0` and `allenai/dolma3_mix-150B-1025` ship
  #   `.jsonl.zst`; `datasets` cannot stream them without it (BSD-3-Clause).
  "zstandard>=0.22",
  # -- post-training (r52/posttrain) --------------------------------------------------
  # reasoning-gym: procedural RLVR environments + their verifiers (Apache-2.0);
  #   docs/PLAN.md §5's RL environment choice. Pulls matplotlib/sympy/arckit for the
  #   puzzle generators and pins tabulate<0.10 (harmless for lm_eval).
  "reasoning-gym>=0.1.25",
  # mlx-lm-lora: the DPO/GRPO/GSPO/DAPO layer for MLX (Apache-2.0, research/02 §Stage 9).
  #   Used as the alternative RL backend (`--backend mlx-lm-lora`), driven as a CLI,
  #   never vendored.
  "mlx-lm-lora>=3.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Explicit rule set so `ruff check` is reproducible regardless of a user-level ruff config.
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]  # single-expression lambdas are the clearest way to write schedule fixtures

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["r52"]
