# Tiny smoke-test config: 2 layers, d=64. Used by tests/ and for pipeline validation.
name: tiny_test

model:
  n_layer: 2
  n_embd: 64
  n_head: 2
  vocab_size: 50304
  block_size: 128
  mlp: relu2
  mlp_ratio: 4.0
  qk_norm: true
  use_value_embeds: true
  n_value_embeds: 1
  value_embed_share: true
  use_unet_skips: true
  softcap: 15.0
  precision: mixed
  grad_checkpoint: false

data:
  source: fineweb
  data_dir: data/fineweb10B-gpt2
  val_file: fineweb_val_000000.bin
  val_tokens: 10485760

train:
  micro_batch: 8
  tokens_per_step: 4096        # 8 x 128 x 4 accum
  # Hyper-parameters unchanged from gpt2_124m_mac (see that file for provenance).
  muon_lr: 0.05
  adam_lr_embed: 0.6
  adam_lr_head: 0.008
  adam_lr_scalar: 0.04
  adam_wd_embed: 0.025
  adam_wd_head: 0.75
  adam_wd_scalar: 0.0
  warmup_steps: 20
  cooldown_frac: 0.4
  final_lr_frac: 0.15
  grad_clip: 1.0
  max_tokens: 2000000          # 2M tokens ~ 500 steps
  log_interval: 20
  val_interval: 100
  val_max_batches: 8           # 8 x 8 x 128 = 8,192 tokens
  ckpt_interval: 200
  keep_last: 2
  memory_limit_gb: 6.0
  seed: 1337
  compile: true
