# 2-layer midtraining run used to validate the pipeline (20 steps, seconds of GPU).
#   python scripts/prepare_midtrain_data.py configs/posttrain/midtrain_tiny.yaml
#   python -m r52.posttrain.midtrain configs/posttrain/midtrain_tiny_train.yaml \
#       --init-from runs/tiny200/ckpt/best --run-name mt --max-steps 20
name: midtrain_tiny

model:
  n_layer: 2
  n_embd: 64
  n_head: 2
  vocab_size: 50304
  block_size: 128
  mlp: relu2
  mlp_ratio: 4.0
  qk_norm: true
  use_value_embeds: true
  n_value_embeds: 1
  value_embed_share: true
  use_unet_skips: true
  softcap: 15.0
  precision: mixed
  grad_checkpoint: false

data:
  source: fineweb
  data_dir: data/midtrain-tiny
  train_glob: "midtrain_train_*.bin"
  val_file: midtrain_val_000000.bin
  val_tokens: 50000

train:
  micro_batch: 8
  tokens_per_step: 4096      # 8 x 128 x 4 accum
  muon_lr: 0.0125            # tiny_test 0.05 / 4
  adam_lr_embed: 0.15
  adam_lr_vembed: 0.15
  adam_lr_head: 0.002
  adam_lr_scalar: 0.01
  adam_wd_embed: 0.025
  adam_wd_head: 0.75
  adam_wd_scalar: 0.0
  warmup_steps: 5
  cooldown_frac: 0.6
  final_lr_frac: 0.0
  grad_clip: 1.0
  max_tokens: 200000         # ~49 steps of schedule; --max-steps 20 stops early
  log_interval: 5
  val_interval: 10
  val_max_batches: 4
  ckpt_interval: 20
  keep_last: 1
  memory_limit_gb: 2.0
  cache_limit_gb: 0.5
  seed: 1337
  compile: false
