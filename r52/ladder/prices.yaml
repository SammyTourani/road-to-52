#
# GPU/accelerator rental prices and peak-FLOPS figures for the compute ladder.
#
# HONEST-NUMBERS RULE (docs/ARCHITECTURE.md §1.3): every row carries a source URL and a
# retrieval date.  The one exception is an in-house measurement, which carries
# `measured: true` plus a `source` string instead of a URL (see `mac_m4_10core`).
#
# All prices are USD per *accelerator* hour (per GPU, per chip for TPUs).
# Everything here is transcribed from research/04-landscape-and-compute.md §B.2/§B.3/§B.5,
# which was compiled and link-checked on 2026-09-13.

meta:
  retrieved: "2026-09-13"
  currency: USD
  compiled_from:
    - "research/04-landscape-and-compute.md §B.2 (GPU rental prices, September 2026)"
    - "research/04-landscape-and-compute.md §B.3 (Google TPU pricing)"
    - "research/04-landscape-and-compute.md §B.5 (the compute ladder: peak TFLOPS + price floors)"
  notes: >-
    research/04 §B.5 fixes the ladder's price floors as "the verified Sept 2026 floors from §B.2:
    H100 spot $0.94, H100 on-demand $2.43, B200 $3.49".  Rows marked `verified: false` are
    third-party quotes that research/04 itself tags UNVERIFIED; the ladder never selects them
    when resolving a cheapest-spot / cheapest-on-demand price.

# ---------------------------------------------------------------------------------------
# Accelerators.  `peak_tflops` is dense BF16 unless `peak_basis` says otherwise, and is set
# ONLY where research/04 states or derives it.  Where the research corpus carries no figure
# it is left null rather than guessed -- no rung uses those accelerators.
# ---------------------------------------------------------------------------------------
hardware:

  h100:
    name: NVIDIA H100 SXM 80GB
    peak_tflops: 989.0
    peak_basis: "BF16 dense"
    source: "research/04 §B.5: 'H100 SXM peak BF16 dense = 989 TFLOP/s'"
    source_url: "https://arxiv.org/pdf/2412.19437"
    retrieved: "2026-09-13"
    notes: >-
      989 TFLOP/s is the figure research/04 §B.5 uses as the ladder denominator and the one
      against which the three calibration runs (SmolLM3, DeepSeek-V3, Llama 3.1 405B) reproduce
      their published implied MFUs.

  h800:
    name: NVIDIA H800 SXM 80GB
    peak_tflops: 989.0
    peak_basis: "BF16 dense (same as H100)"
    source: >-
      Derived from research/04 §B.5, which converts DeepSeek-V3's disclosed 2.788M H800-hours to
      an implied MFU of 33.1% using the H100 bf16 dense peak -- i.e. §B.5 treats H800 as
      compute-identical to H100 (the export-control difference is interconnect, not FLOPS).
    source_url: "https://arxiv.org/pdf/2412.19437"
    retrieved: "2026-09-13"
    derived: true

  h100_pcie:
    name: NVIDIA H100 PCIe 80GB
    peak_tflops: null
    peak_basis: null
    source: >-
      research/04 §B.2 carries a RunPod PCIe price but no PCIe peak-FLOPS figure.  The PCIe part
      is materially slower than the 989 TFLOP/s SXM part, so it gets its own key and a null peak
      rather than inheriting the SXM number -- otherwise its $1.99 rate would silently become the
      H100 "on-demand floor" and undercut the $2.43 figure research/04 §B.5 actually uses.
    source_url: "https://www.runpod.io/pricing"
    retrieved: "2026-09-13"

  h200:
    name: NVIDIA H200 SXM 141GB
    peak_tflops: null
    peak_basis: null
    source: >-
      research/04 carries H200 *prices* (§B.2) but no peak-FLOPS figure.  Left null rather than
      asserted; no ladder rung uses an H200.
    source_url: "https://www.runpod.io/pricing"
    retrieved: "2026-09-13"

