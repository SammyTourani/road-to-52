    source_url: "https://cloud.google.com/tpu/pricing"
    retrieved: "2026-09-13"

  tpu_v7:
    name: Google Cloud TPU v7 "Ironwood" (per chip)
    peak_tflops: null
    peak_basis: null
    source: >-
      research/04 §B.3: Ironwood (v7) is GA and publicly priced as of Sept 2026, but the research
      corpus carries no peak-FLOPS figure.
    source_url: "https://cloud.google.com/tpu/pricing"
    retrieved: "2026-09-13"

  mac_m4_10core:
    name: Apple M4 (10-core GPU) -- Mac Mini, 16 GB unified memory
    peak_tflops: 4.26
    peak_basis: "theoretical FP32"
    measured: true
    source: "measured 2026-09-13, road-to-52 probe (this machine: Mac Mini M4, 16 GB, macOS 26.5.2)"
    source_url: null
    retrieved: "2026-09-13"
    measurements:
      theoretical_fp32_tflops: 4.26
      bf16_matmul_tflops: 3.6
      training_effective_tflops: 1.3
      training_effective_at_params: 111.0e6
      # optimized r52 trainer (mixed precision, compiled, Muon+AdamW), 124M / seq 1024:
      training_effective_tflops_optimized: 2.59
      training_effective_optimized_at_params: 124.0e6
      # source: results/mlx_pretrain_bench.md, 2026-09-13 (3,034 tok/s)
    notes: >-
      Three numbers, three meanings.  4.26 TFLOPS is the theoretical FP32 peak and is the ladder
      denominator for this accelerator.  3.6 TFLOPS is the measured peak of a raw bf16 matmul.
      1.3 TFLOPS is the measured *training-effective* rate at 111M parameters -- the whole step,
      not just the matmul -- so Rung 0's MFU of 0.3052 is exactly 1.3 / 4.26.  Report MFU against
      both denominators, as docs/ARCHITECTURE.md §4 requires.

