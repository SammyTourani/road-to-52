    name: "Frontier (Fable-class), 2026 -- 1e26 to 1e27 FLOP"
    params_total: null
    params_active: null
    tokens: null
    flops_low: 1.0e26
    flops_high: 1.0e27
    mfu: 0.35
    hardware: h100
    gpus: null
    price: h100_spot_prime_intellect
    beats: "n/a -- this is the bar, not a rung"
    status: done
    verified: false
    notes: >-
      research/04 §B.1 Tier 4: "Frontier 2026 runs: 1e26 - 1e27 FLOP; ~$200-500M/run (GPT-5 /
      Gemini Ultra class)" -- tagged UNVERIFIED secondary, and research/04 adds the important
      correction that "Epoch's cost article does not publish per-model dollar figures... Per-model
      2026 cost claims on secondary sites are NOT Epoch-sourced."  ANTHROPIC HAS DISCLOSED
      NOTHING for Fable 5 / Fable 5.1 / Opus 5: no GPU-hours, no FLOPs, no cost.  The dollar
      figures this ladder prints for this row are our own 6ND-style arithmetic at 35% MFU on
      September-2026 rental prices, not a disclosure and not an Epoch estimate.  What Epoch does
      publish (research/04 §B.1 Tier 4): frontier training cost has grown 2.4x/year since 2016
      (95% CI 2.0-3.1x); hardware is 47-67% of cost, R&D staff 29-49%, energy 2-6%; and "the
      largest training runs will cost more than a billion dollars by 2027".  research/04 §B.5
      reading 2: "The frontier is 1e26-1e27 FLOP; this ladder's largest row is 9.4e24.  A student
      is two orders of magnitude short at minimum."
