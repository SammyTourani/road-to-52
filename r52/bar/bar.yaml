benchmarks:

  # ---- The 2026 consensus set (research/01 §1.4) -------------------------------------

  - id: terminal-bench-4
    name: Terminal-Bench 4.0
    measures: 66 containerised terminal tasks; sci-adjacent and frontier engineering
    url: "https://www.tbench.ai/leaderboard"
    harness: "Harbor. 8 saturated tasks removed, 20 revised, uniform 8h timeout."
    category: frontier-2026
    unit: "%"
    higher_is_better: true
    saturated: false
    local_runnable: false
    consensus_rank: "1 of 9 launches report it -- the single most-reported benchmark of 2026"
    notes: >-
      NEVER compare across Terminal-Bench versions (research/01 §4.3): 1.0 (May 2025, 80 tasks)
      -> 2.0 (Nov 2025, 89) -> 2.1 (May 2026, 89) -> 3.0 (Jul 2026, 74, formerly FrontierBench)
      -> 4.0 (Aug 2026, 66).  The same model scored 83.3% on 2.1 and 15.7% on 3.0.  Local runs
      are only partly feasible: the dataset includes GPU and multi-container tasks and
      recommends Modal or Daytona.

  - id: terminal-bench-2-1
    name: Terminal-Bench 2.1
    measures: 89 containerised terminal tasks (28 fixed vs 2.0)
    url: "https://www.vals.ai/benchmarks/terminal-bench"
    harness: "Vals AI's single fixed harness for the third-party column; vendor harnesses otherwise."
    category: frontier-2026
    unit: "%"
    higher_is_better: true
    saturated: false
    local_runnable: false
    notes: >-
      Kept only because it is the one benchmark where an open model's ranking *inverts* between
      harnesses: DeepSeek V4.1-Flash self-reports 90.6% (beating every closed model) but scores
      74.53% on the Vals harness, where Fable 5.1 gets 85.02%.  research/01 §6.1.  Not comparable
      to Terminal-Bench 4.0.

