  # Verified, MMLU, MMLU-Pro, AIME, LiveCodeBench, HumanEval or MATH-500."  These benchmarks
  # are DEAD AT THE FRONTIER.  They are in this file anyway, because they are how a 124M model
  # trained on a Mac Mini actually gets measured -- and because a GPT-2-small-class model is
  # nowhere near saturating any of them.

  - id: hellaswag
    name: HellaSwag
    measures: commonsense sentence completion, 10,042 validation examples
    url: "https://github.com/karpathy/llm.c"
    harness: "Loglikelihood of each ending conditioned on the context; GPT-2 tokenizer; accuracy and length-normalised acc_norm. Same protocol as llm.c's hellaswag.py / lm-eval."
    category: classic-local
    unit: "% acc_norm"
    higher_is_better: true
    saturated: true
    local_runnable: true
    notes: >-
      DEAD AT THE FRONTIER -- not reported by any 2026 launch.  Alive here: it is one of the
      three acceptance criteria for Rung 0 (docs/ARCHITECTURE.md §10, HellaSwag >= 29.4%), and
      r52/eval/hellaswag.py implements it in pure MLX.

  - id: arc-challenge
    name: ARC-Challenge
    measures: grade-school science multiple choice, challenge split
    url: "https://github.com/EleutherAI/lm-evaluation-harness"
    harness: "lm-evaluation-harness, loglikelihood multiple choice; acc and acc_norm."
    category: classic-local
    unit: "% acc_norm"
    higher_is_better: true
    saturated: true
    local_runnable: true
    notes: >-
      DEAD AT THE FRONTIER.  Present because it is a standard small-model reporting row and is
      one install away via lm-evaluation-harness.  No frontier lab publishes it any more, so
      every frontier cell here is an em dash -- which is the honest state of the world, not a
      gap in this file.

  - id: mmlu-pro
    name: MMLU-Pro
    measures: 12k harder MMLU multiple-choice questions, 10 options each
    url: "https://github.com/TIGER-AI-Lab/MMLU-Pro"
    harness: "Apache-2.0; regex + exact match; evaluate_from_api.py points straight at Ollama."
    category: classic-local
    unit: "%"
    higher_is_better: true
    saturated: true
    local_runnable: true
    notes: >-
      DEAD AT THE FRONTIER: 0 of 9 September-2026 launches report it, and it appears in the Fable
      5.1 system card only as substrate for an alignment experiment, never as a capability claim.
      research/01 §1.2: "Not reported at the frontier."  No frontier scores exist to record.

  - id: gpqa-diamond
    name: GPQA Diamond
    measures: ~198 PhD-level biology / chemistry / physics multiple-choice questions
    url: "https://github.com/idavidrein/gpqa"
    harness: "MIT licence; exact match on 'ANSWER: X'. Only friction is a free HF gate."
    category: classic-local
    unit: "%"
    higher_is_better: true
    saturated: true
    local_runnable: true
    notes: >-
      The last academic multiple-choice benchmark still standing -- 4 of 9 launches report it
      (OpenAI and the Chinese open-weight labs; Anthropic, Google, Meta and SpaceXAI have all
      dropped it).  SATURATED at 92.6-96.0%, and it is where open weights have already caught
      the frontier: Kimi K3 93.5 vs Fable 5.1 93.7 is a statistical tie.  CONFLICT FLAGGED:
      research/04 §0 quotes 92.6% for Fable 5.1 citing DataScienceDojo, but OpenAI's own table
      (research/01 §2.3) gives Fable 5.1 93.7 and Fable 5 92.6 -- i.e. the secondary aggregator
      has attributed Fable 5's score to Fable 5.1, exactly the failure mode research/01 §6.7
      documents.  This file uses 93.7 for Fable 5.1 and 92.6 for Fable 5.

  - id: gsm8k
    name: GSM8K
    measures: grade-school math word problems, 8.5k problems
    url: "https://github.com/EleutherAI/lm-evaluation-harness"
    harness: "lm-evaluation-harness; exact match on the final numeric answer."
    category: classic-local
    unit: "%"
    higher_is_better: true
    saturated: true
    local_runnable: true
    notes: "DEAD AT THE FRONTIER -- 0 of 9 launches. No frontier scores exist to record."

  - id: math-500
    name: MATH-500
    measures: 500-problem subset of the MATH competition-mathematics dataset
    url: "https://github.com/EleutherAI/lm-evaluation-harness"
    harness: "lm-evaluation-harness; exact match after answer normalisation."
    category: classic-local
    unit: "%"
    higher_is_better: true
    saturated: true
    local_runnable: true
    notes: >-
      DEAD AT THE FRONTIER -- 0 of 9 launches; research/01 §7 records MATH Level 5 as saturated
      at 98.1% and abandoned.  No frontier scores exist to record.

  - id: humaneval
    name: HumanEval
    measures: 164 hand-written Python programming problems, pass@k against unit tests
    url: "https://github.com/EleutherAI/lm-evaluation-harness"
    harness: "Execution-based; pass@1 unless stated."
    category: classic-local
    unit: "% pass@1"
    higher_is_better: true
    saturated: true
    local_runnable: true
    notes: "DEAD AT THE FRONTIER -- 0 of 9 launches. No frontier scores exist to record."

  - id: ifeval
    name: IFEval
    measures: verifiable instruction-following constraints
    url: "https://github.com/EleutherAI/lm-evaluation-harness"
    harness: "lm-evaluation-harness; programmatic constraint checking, no judge model."
    category: classic-local
    unit: "%"
    higher_is_better: true
    saturated: false
    local_runnable: true
    notes: >-
      Not reported by any 2026 frontier launch.  Useful to us because it is judge-free and is the
      cheapest signal that post-training did anything at all.

  - id: dclm-core
    name: DCLM CORE
    measures: 22-task aggregate from DataComp-LM, in nanochat's normalisation
    url: "https://github.com/karpathy/nanochat/blob/master/dev/LEADERBOARD.md"
    harness: "nanochat's scripts/base_eval.py + nanochat/core_eval.py (MIT), ported to MLX in r52/eval/core.py."
    category: classic-local
    unit: CORE
    higher_is_better: true
    saturated: false
    local_runnable: true
    notes: >-
      The single most useful number for a sub-1B model, because nanochat's leaderboard gives a
      directly comparable reference point: GPT-2 (1.6B) = 0.256525.  The DCLM repo itself is
      dead (12 months), but the finding and the eval set outlived it.

  - id: fineweb-val-loss
    name: FineWeb validation loss
    measures: mean cross-entropy on a fixed FineWeb validation set
    url: "https://github.com/KellerJordan/modded-nanogpt"
    harness: "First 10,485,760 tokens of the val shard, non-overlapping windows at the training block_size (modded-nanogpt's protocol). Report bits-per-byte alongside, for tokenizer independence."
    category: classic-local
    unit: nats/token
    higher_is_better: false
    saturated: false
    local_runnable: true
    notes: >-
      LOWER IS BETTER.  3.28 is the modded-nanogpt speedrun target at 124M parameters and is
      Rung 0's primary acceptance criterion (docs/ARCHITECTURE.md §10).  Tokenizer-dependent, so
      only comparable between runs using the same GPT-2 tokenizer and the same val protocol --
      which is exactly why bits-per-byte is reported next to it.

