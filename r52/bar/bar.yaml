#
# THE BAR -- published benchmark scores, with the conditions that make them mean anything.
#
# HONEST-NUMBERS RULE (docs/ARCHITECTURE.md §1.3).  Every score entry carries:
#   benchmark, value, unit, source_url, retrieved, conditions, verified
# `conditions` is the part that actually matters.  research/01 §0: "Every headline number in
# this report is a *model + harness + effort level + grader* tuple.  Treat single numbers as
# meaningless without that tuple."  Where no number exists, THE ENTRY IS OMITTED -- gap.py
# renders an em dash.  Never a zero, never an invention.
#
# `verified: false` carries a flag research/01 or research/04 raised, not our own doubt.
#
# Compiled from research/01-benchmarks-and-bar.md (the benchmark set, Fable 5.1's published
# numbers, the open-weight head-to-head, the saturation scorecard), research/02 (nanochat and
# modded-nanogpt leaderboards) and research/04 (the landscape).  All retrieved 2026-09-13.

meta:
  retrieved: "2026-09-13"
  target_model: claude-fable-5-1
  compiled_from:
    - "research/01-benchmarks-and-bar.md §1.2, §1.4 (the benchmark set), §2.1-§2.5 (Fable 5.1), §3.1-§3.2 (open weights), §4.1 (local), §7 (saturation)"
    - "research/02-open-training-stack.md (nanochat dev/LEADERBOARD.md, modded-nanogpt records)"
    - "research/04-landscape-and-compute.md §0, §A.1, §A.3 (the landscape)"
  health_warning: >-
    Three standing warnings from research/01 §6.  (1) The harness is worth more than the model:
    flipping two API settings took GPT-5.6 Sol from 13.3% to 38.3% on ARC-AGI-3, same model.
    (2) Anthropic evaluates with production safeguards ON, scoring zero where a classifier fires,
    while comparison models run with them off -- published Claude scores understate raw
    capability.  (3) Composite indices refit globally and are not comparable across versions:
    Artificial Analysis moved Fable 5.1 through 65.7 -> 57 -> 53 in two weeks for the same model.

